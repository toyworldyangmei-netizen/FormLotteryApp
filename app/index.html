<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>表單抽選 App API 測試 V1.0.2</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">🎯</div><div><div class="brand-title">表單抽選 App</div><div class="brand-sub">Google API 測試版 V1.0.2</div></div></div>
      <div class="account-pill" id="accountPill">尚未登入</div>
    </header>

    <section class="hero panel">
      <div>
        <div class="eyebrow">GOOGLE FORM LOTTERY</div>
        <h1>登入後，直接選擇要抽的表單</h1>
        <p>V1.0.2：登入狀態會保存在本機。重新開啟 App 時會自動恢復登入，Access Token 過期時會使用 Refresh Token 更新。</p>
      </div>
      <button class="primary" id="loginBtn">🔵 使用 Google 帳號登入</button>
    </section>

    <section class="panel forms-panel">
      <div class="section-head"><div><h2>我的 Google 表單</h2><p id="statusText">登入後會在這裡顯示你可以使用的 Google Forms。</p></div><button class="secondary" id="refreshBtn" disabled>↻ 重新整理</button></div>
      <div id="formsList" class="forms-list empty"><div><div class="empty-icon">📋</div><div>尚未載入表單</div></div></div>
    </section>

    <section class="panel detail-panel" id="detailPanel" hidden>
      <div class="section-head"><div><h2 id="formTitle">表單</h2><p id="formMeta"></p></div></div>
      <div id="questionList" class="question-list"></div>
    </section>

    <footer><span>V1.0.2：Google OAuth／Token 持久化／自動恢復登入／Forms API</span><button class="text-btn" id="logoutBtn" disabled>登出</button></footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
